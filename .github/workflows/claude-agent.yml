name: DeepSeek Code Review

on:
  push:
    branches: [ "main" ]

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: DeepSeek Code Review
        uses: deepseek-actions/code-review@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
